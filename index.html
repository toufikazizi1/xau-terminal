<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>XAU Terminal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0e0e10;--pn:#1c1c1f;--pn2:#262629;--bd:#2c2c30;--tx:#e8e8ea;--mu:#8b8b93;--up:#26a69a;--dn:#ef5350;--ac:#2962ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px -apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
#views{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-width:0;min-height:0;flex-direction:column}
.view.on{display:flex}
#stage{flex:1;position:relative;min-height:0;touch-action:none;direction:ltr;background:#0e0e10}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hdr{position:absolute;top:4px;left:8px;right:70px;pointer-events:none;direction:ltr;text-align:left}
#hdr>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:8px}
#symChip{background:none;border:0;color:var(--tx);font:700 22px inherit;padding:2px 0;display:flex;align-items:center;gap:6px;cursor:pointer}
#dot{width:9px;height:9px;border-radius:50%;background:#888;flex:none}
#dot.live{background:#26a69a;box-shadow:0 0 6px #26a69a}#dot.demo{background:#ffb300}#dot.err{background:#ef5350}
#stxt{color:var(--mu);font-size:13px}
#hprice{font:700 22px inherit;margin:1px 0}
#ohlc{font-size:13px;color:var(--mu);margin-bottom:4px;text-shadow:0 0 3px #000}
.si{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:800;flex:none;vertical-align:middle;letter-spacing:-.5px}
.si img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.si.ok{color:transparent}
.leg{display:flex;align-items:center;gap:8px;color:#c8c8d0;font-size:15px;height:36px;text-shadow:0 0 3px #000;background:rgba(14,14,16,.82);border-radius:8px;padding:0 6px;margin-bottom:2px;width:fit-content}
.leg .n{max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg.off .n{opacity:.45;text-decoration:line-through}
.ib{background:none;border:0;color:#d0d0d6;padding:4px 7px;cursor:pointer;display:inline-flex;align-items:center}
.ib svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#legTgl{background:#1c1c1f;border:1px solid var(--bd);border-radius:8px;width:44px;height:34px;color:#ddd;margin-top:2px}
#toolPill{position:absolute;top:8px;right:76px;background:var(--ac);color:#fff;border-radius:16px;padding:4px 10px;font-size:12px;display:none;z-index:3;cursor:pointer;direction:rtl}
#ptb{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:4;align-items:stretch}
#ptb button{border:0;border-radius:14px;color:#fff;font:800 17px inherit;min-width:104px;height:54px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;box-shadow:0 2px 10px #0008}
#ptb .b{background:#26a69a}#ptb .s{background:#ef5350}#ptb small{font:600 11px inherit;opacity:.92}
#ptb .acc{background:#23262fee;min-width:112px;font-size:15px}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#1b1d24;color:#ddd;font:700 15px inherit;cursor:pointer}
.seg button.on.b{background:#26a69a;border-color:#26a69a;color:#fff}.seg button.on.s{background:#ef5350;border-color:#ef5350;color:#fff}.seg button.on{background:#2962ff;border-color:#2962ff;color:#fff}
.fld{display:flex;align-items:center;gap:10px;margin:8px 0}.fld label{flex:1;font-size:14px;color:#aaa}.fld input[type=number]{width:140px;direction:ltr;font-size:16px;padding:10px;background:#1b1d24;border:1px solid #333;color:#fff;border-radius:8px}
.pnl-up{color:#26a69a}.pnl-dn{color:#ef5350}
.prow{background:#1b1d24;border-radius:12px;padding:12px;margin:8px 0;display:flex;flex-direction:column;gap:6px;font-size:14px}.prow .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000d;padding:7px 14px;border-radius:8px;font-size:12px;display:none;z-index:3;white-space:nowrap}
#ctb{flex:none;display:flex;align-items:center;gap:4px;padding:8px 10px;background:var(--bg);border-top:1px solid var(--bd);direction:ltr}
#ctb .sp{flex:1}
#ctb .tb{background:none;border:0;color:#cfcfd6;padding:10px 13px;min-width:48px;min-height:48px;justify-content:center;border-radius:8px;cursor:pointer;display:flex;align-items:center}
#ctb .tb.hl{background:var(--pn2);color:#fff}
#ctb .tb svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chip{background:var(--pn2);color:var(--tx);border:0;border-radius:8px;padding:12px 16px;font:700 16px inherit;cursor:pointer;margin-left:6px;min-height:48px;white-space:nowrap}
#nav{flex:none;display:flex;height:72px;background:#0b0b0d;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:#9a9aa2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:13px inherit;cursor:pointer}
#nav button svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:#fff}
/* sheets */
#back{position:fixed;inset:0;background:#0009;display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-radius:18px 18px 0 0;z-index:21;max-height:82vh;display:none;flex-direction:column;padding:8px 14px 18px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#sheet .hd{width:44px;height:4px;border-radius:2px;background:#555;margin:2px auto 10px}
#sheet h3{margin:4px 0 10px;font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
.bk{background:#23262f;border:0;color:#fff;border-radius:12px;width:48px;height:48px;font-size:26px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
#sbody{overflow-y:auto;min-height:0;flex:1 1 auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.li{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--bd);cursor:pointer}
.li.sel{color:#6ea0ff;font-weight:600}
.li .g{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--pn2);border:1px solid var(--bd);border-radius:12px;padding:14px 6px;text-align:center;cursor:pointer;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:90px;justify-content:center}
.tile svg{width:26px;height:26px;stroke:#ddd;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile:active,.li:active{background:#33333a}
.sec{color:var(--mu);font-size:12px;margin:12px 4px 2px}
button,select{font:inherit}
.btn{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=text],input[type=number]{background:#0e0e10;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;font:inherit;width:100%}
textarea{width:100%;height:260px;background:#0a0a0c;color:#d1d4dc;border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px/1.5 Consolas,Menlo,monospace;direction:ltr;tab-size:2}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}
.modal.show{display:flex}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:14px;width:min(600px,95vw);max-height:92vh;overflow:auto;padding:14px}
.box h3{margin:0 0 10px}
#err{color:#ef5350;font-size:12px;min-height:16px;white-space:pre-wrap;margin-top:6px;direction:ltr;text-align:left}
.small{color:var(--mu);font-size:11px}
/* watchlist */
#wlh{padding:14px 16px 6px;font:700 20px inherit}
#wl{overflow:auto;flex:1}
.wr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.wr .a{flex:1}.wr .a b{font-size:16px}.wr .a div{color:var(--mu);font-size:12px;margin-top:2px}
.wr .p{text-align:left;direction:ltr}.wr .p b{font-size:16px;display:block}
.up{color:var(--up)}.dn{color:var(--dn)}
html.wide #sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);animation:none;border-radius:18px}
</style>
</head>
<body>
<div id="app">
 <div id="views">
  <section class="view on" id="vChart">
   <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hdr">
      <div class="hrow"><button id="symChip"></button><span id="dot"></span><span id="stxt"></span></div>
      <div id="hprice"></div>
      <div id="ohlc"></div>
      <div id="legs"></div>
      <button id="legTgl">⌄</button>
    </div>
    <div id="toolPill"></div>
    <div id="ptb"><button class="s" id="ptSell"><span>بيع</span><small id="ptSellP"></small></button><button class="acc" id="ptAcc"><span id="ptEq">10,000$</span><small id="ptPnl">حسابي</small></button><button class="b" id="ptBuy"><span>شراء</span><small id="ptBuyP"></small></button></div>
<div id="toast"></div>
   </div>
   <div id="ctb">
     <button class="tb" id="tbUndo" title="تراجع"></button>
     <button class="tb" id="tbMore" title="إعدادات"></button>
     <button class="tb hl" id="tbMenu" title="محور التحليل"></button>
     <button class="tb" id="tbInd" title="مؤشرات"></button>
     <button class="tb" id="tbDraw" title="رسم"></button>
     <span class="sp"></span>
     <button class="chip" id="tfChip"></button>
     <button class="chip" id="symChip2"></button>
   </div>
  </section>
  <section class="view" id="vWatch">
    <div id="wlh" style="display:flex;align-items:center;gap:10px"><button class="bk" id="wBack" aria-label="رجوع">➜</button><span>قائمة المراقبة</span></div>
    <div id="wl"></div>
  </section>
 </div>
 <nav id="nav">
   <button data-v="watch"></button>
   <button data-v="chart" class="on"></button>
   <button data-v="ind"></button>
   <button data-v="menu"></button>
 </nav>
</div>
<div id="back"></div>
<div id="sheet"><div class="hd"></div><h3><button class="bk" id="sBack" aria-label="رجوع">➜</button><span id="stitle"></span></h3><div id="sbody"></div></div>

<div class="modal" id="mCode"><div class="box">
  <h3 style="display:flex;align-items:center;gap:10px"><button class="bk" id="eBack" aria-label="رجوع">➜</button><span>محرر المؤشر (JavaScript)</span></h3>
  <input type="text" id="cName" placeholder="اسم المؤشر">
  <div style="height:8px"></div>
  <textarea id="cText" spellcheck="false"></textarea>
  <div class="small" style="margin-top:6px">إعدادات (JSON) تصل للكود باسم params:</div>
  <input type="text" id="cParams" value="{}" style="direction:ltr">
  <div id="err"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button id="cSave" class="btn on">حفظ وتشغيل</button>
    <button id="cDel" class="btn">حذف</button>
    <button id="cClose" class="btn">إغلاق</button>
  </div>
</div></div>

<script>
'use strict';
let UK=1;
function fitScale(){const w=innerWidth,h=innerHeight;UK=(navigator.maxTouchPoints>0&&w>560&&w<1500)?w/412:1;
  document.documentElement.classList.toggle('wide',UK===1&&w>=900);const b=document.body.style;if(UK>1){b.width=(w/UK)+'px';b.height=(h/UK)+'px';b.transform='scale('+UK+')';b.transformOrigin='0 0';b.position='absolute';b.left='0';b.top='0'}else{b.width='';b.height='';b.transform='';b.position='';}}
fitScale();
/* ================= الإعدادات ================= */
const SYMS=[
  {id:'GOLD',name:'الذهب XAU/USD',coin:'xyz:GOLD',step:0.1,dec:2,base:4060},
  {id:'BTC',name:'BTC/USD',coin:'BTC',step:1,dec:1,base:90000},
  {id:'ETH',name:'ETH/USD',coin:'ETH',step:0.1,dec:2,base:3000},
  {id:'SOL',name:'SOL/USD',coin:'SOL',step:0.01,dec:3,base:140}
];
const TFS=[[10,'10s'],[30,'30s'],[60,'1m'],[300,'5m'],[900,'15m'],[3600,'1h']];
const HLINT={60:'1m',300:'5m',900:'15m',3600:'1h'};
const $=id=>document.getElementById(id);
const COMM={GOLD:['#f5c542','#b8860b','Au'],SILVER:['#d9dde3','#8a919c','Ag'],COPPER:['#d98a5b','#8c4a24','Cu'],PLATINUM:['#e5e4e2','#8e9aa6','Pt'],PALLADIUM:['#cfd8dc','#78909c','Pd'],OIL:['#37474f','#101820','OIL'],CL:['#37474f','#101820','OIL'],BRENTOIL:['#37474f','#101820','OIL'],NATGAS:['#4fc3f7','#0277bd','GAS'],URANIUM:['#9ccc65','#33691e','U']};
const svgIco=(c,t)=>'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs><circle cx="32" cy="32" r="31" fill="url(#g)"/><circle cx="32" cy="32" r="25" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/><text x="32" y="40" text-anchor="middle" font-family="Arial" font-weight="800" font-size="'+(t.length>2?18:24)+'" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width=".6">'+t+'</text></svg>');
function symIco(y,px){
  px=px||32;const id=y.id,coin=y.coin||id;let src='',bg='#2a2e39',stock=false;
  const h=[...id].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);bg='hsl('+(h%360)+',55%,38%)';
  if(COMM[id]){src=svgIco(COMM[id],COMM[id][2])}
  else if(/^xyz:/.test(coin)){stock=true;src='https://financialmodelingprep.com/image-stock/'+id.replace(/[^A-Z0-9.]/gi,'')+'.png'}
  else src='https://app.hyperliquid.xyz/coins/'+encodeURIComponent(coin)+'.svg';
  const t=id.length>4?id.slice(0,3):id;
  return '<span class="si" style="width:'+px+'px;height:'+px+'px;font-size:'+Math.round(px*(t.length>3?.28:.34))+'px;background:'+bg+'"><span>'+t+'</span><img loading="lazy" referrerpolicy="no-referrer" src="'+src+'" onload="this.parentNode.classList.add(\'ok\');'+(stock?"this.parentNode.style.background=\'#fff\'":'')+'" onerror="this.remove()"></span>'}
const cv=$('cv'),cx=cv.getContext('2d');

/* ================= الحالة ================= */
const S={
  sym:SYMS[0],tf:60,ct:'candle',demoPref:false,last:{},dayOpen:{},alerts:[],meas:null,bars:[],snaps:[],big:[],demo:false,
  barW:9,right:0,yZoom:1,cross:null,
  sh:{vol:true,delta:false,prof:true,hvn:true,heat:true,bigt:true},
  inds:[],objs:[],drawings:[],tool:'cross',pend:null,
  gotData:false,tok:0,sizeEma:0
};
function save(){try{localStorage.setItem('xt1',JSON.stringify({sym:S.sym.id,tf:S.tf,ct:S.ct,sh:S.sh,inds:S.inds.map(i=>({id:i.id,code:(i.builtin&&!i.edited)?null:i.code,edited:i.edited||false,name:i.name,params:i.params,on:i.on,builtin:i.builtin})),dr:S.drawings,cfg:S.cfg,hid:S.hid}))}catch(e){}}
const CFG0={vol:{ma:20},prof:{w:90,va:70},hvn:{n:3,th:1.4},heat:{op:1},bigt:{k:7,max:22},delta:{}};
S.cfg=JSON.parse(JSON.stringify(CFG0));S.hid={};
const CFGF={vol:[['ma','متوسط الحجم (MA)',1,100,1]],prof:[['w','عرض البروفايل (بكسل)',40,220,5],['va','Value Area %',50,95,1]],hvn:[['n','عدد المستويات',1,8,1],['th','الحد الأدنى (× المتوسط)',1,4,0.1]],heat:[['op','شدة الألوان',0.3,2.5,0.1]],bigt:[['k','حجم الصفقة الكبيرة (× المتوسط)',2,30,1],['max','أقصى حجم للكرة',8,50,1]],delta:[]};
function openCfg(k){openSheet(SHN[k]+' — إعدادات',b=>{
  const F=CFGF[k]||[];if(!F.length){const d=document.createElement('div');d.className='small';d.style.padding='14px';d.textContent='لا توجد إعدادات لهذا العنصر';b.appendChild(d)}
  for(const f of F){const d=li(b,'<span class="g">'+f[1]+'</span><input type="number" style="width:110px" min="'+f[2]+'" max="'+f[3]+'" step="'+f[4]+'" value="'+S.cfg[k][f[0]]+'">',()=>{},false);
    d.querySelector('input').onchange=e=>{let v=+e.target.value;if(!isFinite(v))return;v=Math.max(f[2],Math.min(f[3],v));S.cfg[k][f[0]]=v;e.target.value=v;save();dirty=true}}
  const rb=document.createElement('button');rb.className='btn';rb.style.cssText='width:100%;margin-top:12px;padding:12px';rb.textContent='استرجاع الافتراضي';rb.onclick=()=>{S.cfg[k]=JSON.parse(JSON.stringify(CFG0[k]));save();dirty=true;openCfg(k)};b.appendChild(rb)})}
function detectParams(i){const out={};const re=/params\.(\w+)\s*(?:\|\||\?\?)\s*(-?\d+\.?\d*|'[^']*'|"[^"]*"|true|false)/g;let m;
  while((m=re.exec(i.code||''))){let v=m[2];if(v==='true')v=true;else if(v==='false')v=false;else if(/^['"]/.test(v))v=v.slice(1,-1);else v=+v;if(!(m[1] in out))out[m[1]]=v}
  for(const k in (i.params||{}))out[k]=i.params[k];return out}
function openIndSettings(i){openSheet(i.name+' — إعدادات',b=>{
  const P=detectParams(i),ks=Object.keys(P);
  if(!ks.length){const d=document.createElement('div');d.className='small';d.style.padding='14px';d.textContent='هذا المؤشر ما فيه إعدادات. تقدر تعدّل الكود.';b.appendChild(d)}
  for(const k of ks){const v=P[k],isB=typeof v==='boolean',isN=typeof v==='number';
    const d=li(b,'<span class="g" style="direction:ltr">'+k+'</span>'+(isB?'<input type="checkbox" '+(v?'checked':'')+'>':'<input type="'+(isN?'number':'text')+'" step="any" style="width:130px;direction:ltr" value="'+v+'">'),()=>{},false);
    const inp=d.querySelector('input');inp.onchange=()=>{i.params=i.params||{};i.params[k]=isB?inp.checked:isN?(+inp.value):inp.value;if(isN&&!isFinite(i.params[k]))i.params[k]=v;save();dirty=true;legKey=''};
    if(isB)d.onclick=e=>{if(e.target!==inp)inp.checked=!inp.checked;inp.onchange()}}
  const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;margin-top:12px';
  const e=document.createElement('button');e.className='btn on';e.style.cssText='flex:1;padding:12px';e.textContent='تعديل الكود';e.onclick=()=>{closeSheet();openEditor(i)};
  const r=document.createElement('button');r.className='btn';r.style.cssText='flex:1;padding:12px';r.textContent='استرجاع الافتراضي';r.onclick=()=>{i.params={};save();dirty=true;openIndSettings(i)};
  row.appendChild(e);if(ks.length)row.appendChild(r);b.appendChild(row)})}
function libGet(){try{return JSON.parse(localStorage.getItem('xt_lib')||'[]')}catch(e){return[]}}
function libSet(a){try{localStorage.setItem('xt_lib',JSON.stringify(a))}catch(e){}}
function libSave(i){if(i.builtin)return;const a=libGet().filter(x=>x.id!==i.id);a.push({id:i.id,name:i.name,code:i.code,params:i.params});libSet(a)}
function removeFromChart(i){S.inds=S.inds.filter(x=>x!==i);save();dirty=true;legKey=''}
function load(){try{const j=JSON.parse(localStorage.getItem('xt1')||'null');return j}catch(e){return null}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function fmt(v){return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v>=100?v.toFixed(0):v.toFixed(1)}
function fp(p){return p.toFixed(S.sym.dec)}

/* ================= مؤشرات مدمجة (نفس واجهة الكود الحر) ================= */
const BUILTIN=[

/* ================= أدوات تحليل ================= */
const ta={
 sma(a,n){const o=[];let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];o.push(i>=n-1?s/n:null)}return o},
 ema(a,n){const o=[],k=2/(n+1);let e=null;for(let i=0;i<a.length;i++){e=e===null?a[i]:a[i]*k+e*(1-k);o.push(i>=n-1?e:null)}return o},
 atr(b,n){const o=[];let a=null;for(let i=0;i<b.length;i++){const tr=i?Math.max(b[i].h-b[i].l,Math.abs(b[i].h-b[i-1].c),Math.abs(b[i].l-b[i-1].c)):b[i].h-b[i].l;a=a===null?tr:(a*(n-1)+tr)/n;o.push(a)}return o},
 highest(a,n){return a.map((_,i)=>i<n-1?null:Math.max(...a.slice(i-n+1,i+1)))},
 lowest(a,n){return a.map((_,i)=>i<n-1?null:Math.min(...a.slice(i-n+1,i+1)))},
 rsi(a,n){const o=[];let g=0,l=0;for(let i=0;i<a.length;i++){if(!i){o.push(null);continue}const d=a[i]-a[i-1];const u=Math.max(d,0),w=Math.max(-d,0);if(i<=n){g+=u/n;l+=w/n}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+w)/n}o.push(i<n?null:100-100/(1+g/(l||1e-9)))}return o}
};

function drawHeat(){

  const sn=S.snaps;

    for(let i=i0;i<=i1;i++){const b=B[i];if(!b||b.t+ms>fs)continue;const m=new Map();
      const ks=Object.keys(b.lv);
      if(ks.length){for(const k of ks){const L=b.lv[k],r=Math.floor(k*S.sym.step/rowH);m.set(r,(m.get(r)||0)+L[0]+L[1])}}

let prof=null;
function buildProfile(){
  const B=S.bars,st=S.sym.step;

  const bins=new Map();
  const add=(p,b,s)=>{const k=Math.floor(p/binSz+1e-9);const o=bins.get(k)||[0,0];o[0]+=b;o[1]+=s;bins.set(k,o)};
  for(let i=i0;i<=i1;i++){const b=B[i];if(!b)continue;
    const ks=Object.keys(b.lv);
    if(ks.length){for(const k of ks){const L=b.lv[k];add(k*st,L[1],L[0])}}
    else{const n=Math.max(1,Math.round((b.h-b.l)/binSz)+1);for(let q=0;q<n;q++)add(b.l+q*binSz,b.bv/n,b.sv/n)}}

    while(acc<tot*(S.cfg.prof.va/100)&&(lo>0||hi<arr.length-1)){const dn=lo>0?arr[lo-1].t:-1,up=hi<arr.length-1?arr[hi+1].t:-1;if(up>=dn){hi++;acc+=arr[hi].t}else{lo--;acc+=arr[lo].t}}

const ptrs=new Map();let ptDrag=null,panStart=null,pinch=null,tapT=0,moved=0;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();
  ptrs.set(e.pointerId,{x:(e.clientX-r.left)/UK,y:(e.clientY-r.top)/UK});moved=0;tapT=Date.now();
  const p=ptrs.get(e.pointerId);
  if(ptrs.size===1&&p.x<plotW&&!S.ptSet){const h=ptHit(p.x,p.y);if(h){ptDrag={...h,y0:p.y,mv:false};panStart=null;return}}
  if(ptrs.size===2){ptDrag=null;const a=[...ptrs.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),bw:S.barW};panStart=null}
  else{if(p.x>plotW&&Date.now()-(S._at||0)<350){S.yZoom=1;S.yOff=0;dirty=true}if(p.x>plotW)S._at=Date.now();panStart={x:p.x,y:p.y,right:S.right,axis:p.x>plotW,yz:S.yZoom,yo:S.yOff||0}}
});
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/UK,y=(e.clientY-r.top)/UK;
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x,y});
  if(ptDrag&&ptrs.has(e.pointerId)){
    if(Math.abs(y-ptDrag.y0)>8)ptDrag.mv=true;
    if(ptDrag.mv&&ptDrag.kind!=='entry'){const pr=pOfY(y),p=ptDrag.p,b=p.side==='buy';
      if(ptDrag.kind==='ord')p.price=pr;
      else if(ptDrag.kind==='sl'&&(b?pr<p.entry:pr>p.entry))p.sl=pr;
      else if(ptDrag.kind==='tp'&&(b?pr>p.entry:pr<p.entry))p.tp=pr;
      S.cross={x,y};dirty=true}
    return}
  if(pinch&&ptrs.size===2){const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);S.barW=Math.max(1.5,Math.min(140,pinch.bw*d/pinch.d));moved=99;dirty=true;return}
  if(panStart&&ptrs.has(e.pointerId)){
    const dx=x-panStart.x,dy=y-panStart.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    if(panStart.axis){S.yZoom=Math.max(0.15,Math.min(8,panStart.yz*Math.exp(dy*0.006)))}
    else if(moved>6||S.tool==='cross'){S.right=panStart.right-dx/S.barW;if(moved>6)S.yOff=panStart.yo+dy*(yMax-yMin)/(mainH*0.92);
      const n=S.bars.length;S.right=Math.max(5,Math.min(n+60,S.right))}
    dirty=true;
  }
  if(e.pointerType==='mouse'||S.tool!=='cross'){S.cross={x,y};dirty=true}
});
function endPtr(e){
  const was=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
  if(ptDrag){const d=ptDrag;ptDrag=null;if(!ptrs.size)panStart=null;
    if(e.type==='pointercancel'){dirty=true;return}
    if(d.mv&&d.kind!=='entry'){ptSave();toast((d.kind==='sl'?'SL ':d.kind==='tp'?'TP ':'سعر الأمر ')+fm(d.kind==='ord'?d.p.price:d.p[d.kind],S.sym.dec))}
    else if(!d.mv)openPosSheet(d.p,d.kind);
    dirty=true;return}
  if(ptrs.size<2)pinch=null;
  if(was&&moved<7&&Date.now()-tapT<350&&was.x<plotW){
    S.cross={x:was.x,y:was.y};handleTap(was.x,was.y);dirty=true}
  if(!ptrs.size)panStart=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){S.cross=null;dirty=true}});
cv.addEventListener('wheel',e=>{
  e.preventDefault();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/UK;
  const iAt=iOfX(x);
  if(x>plotW){S.yZoom=Math.max(0.15,Math.min(8,S.yZoom*(e.deltaY>0?1.1:0.9)))}
  else{S.barW=Math.max(1.5,Math.min(140,S.barW*(e.deltaY>0?0.9:1.1)));S.right=iAt+(plotW-x)/S.barW}
  dirty=true;
},{passive:false});
function handleTap(x,y){
  if(S.ptSet){const a=S.ptSet;S.ptSet=null;const pr=+pOfY(y).toFixed(S.sym.dec),b=a.p.side==='buy';
    if(!S.pt.pos.includes(a.p)){return}
    if(a.kind==='sl'&&(b?pr>=a.p.entry:pr<=a.p.entry))toast('SL في الاتجاه الخاطئ');
    else if(a.kind==='tp'&&(b?pr<=a.p.entry:pr>=a.p.entry))toast('TP في الاتجاه الخاطئ');
    else{a.p[a.kind]=pr;ptSave();toast((a.kind==='sl'?'SL ':'TP ')+fm(pr,S.sym.dec))}
    openPosSheet(a.p);dirty=true;return}
  if(S.tool==='cross'){if(S.meas){S.meas=null;dirty=true}return}
  if(!S.bars.length)return;
  const t0=S.bars[0].t,t=t0+iOfX(x)*tfMs(),p=pOfY(y),T=S.tool;
  if(T==='h'){S.drawings.push({sym:S.sym.id,k:'h',p1:p});save();setTool('cross')}
  else if(T==='v'){S.drawings.push({sym:S.sym.id,k:'v',t1:t});save();setTool('cross')}
  else if(T==='x'){const tx=prompt('النص:');if(tx){S.drawings.push({sym:S.sym.id,k:'x',t1:t,p1:p,tx});save()}setTool('cross')}
  else if(['t','a','r','f','m'].includes(T)){
    if(!S.pend){S.pend={k:T,t1:t,p1:p};toast('اختر النقطة الثانية')}
    else{if(T==='m')S.meas={t1:S.pend.t1,p1:S.pend.p1,t2:t,p2:p};else S.drawings.push({sym:S.sym.id,k:T,t1:S.pend.t1,p1:S.pend.p1,t2:t,p2:p});S.pend=null;save();setTool('cross')}
  }
}

const ALLTF=[10,30];for(let m=1;m<=20;m++)ALLTF.push(m*60);ALLTF.push(1800,3600,7200,10800,14400,18000,21600,25200,28800,86400,604800,2592000);
const tfName=t=>t<60?t+' ث':t<3600?(t/60)+' د':t<86400?(t/3600)+' س':t===86400?'1 ي':t===604800?'1 أ':t===2592000?'1 ش':(t/86400)+' ي';
for(const t of ALLTF)TFN[t]=tfName(t);
const BASES=[[2592000,'1M'],[604800,'1w'],[259200,'3d'],[86400,'1d'],[43200,'12h'],[28800,'8h'],[14400,'4h'],[7200,'2h'],[3600,'1h'],[1800,'30m'],[900,'15m'],[300,'5m'],[180,'3m'],[60,'1m']];
function baseFor(tf){for(const b of BASES)if(b[0]<=tf&&tf%b[0]===0)return b;return null}
const WK0=345600000;
function bucketT(t,ms){return ms===604800000?Math.floor((t-WK0)/ms)*ms+WK0:Math.floor(t/ms)*ms}
function aggregate(arr,ms){const out=[];let cur=null;for(const c of arr){const bt=bucketT(c.t,ms);
  if(!cur||cur.t!==bt){cur={t:bt,o:c.o,h:c.h,l:c.l,c:c.c,v:c.v,bv:c.bv,sv:c.sv,lv:{},est:true};out.push(cur)}
  else{if(c.h>cur.h)cur.h=c.h;if(c.l<cur.l)cur.l=c.l;cur.c=c.c;cur.v+=c.v;cur.bv+=c.bv;cur.sv+=c.sv}}return out}

const FEE=0.0001;
const ptPx=id=>S.last[id]||0;
const ptPnl=(p,px)=>(px-p.entry)*p.qty*(p.side==='buy'?1:-1);
const ptNet=(p,px)=>ptPnl(p,px)-p.fee-p.qty*px*FEE; // الصافي بعد رسوم الدخول والخروج = ما سيُسجَّل عند الإغلاق
const fm=(v,d)=>(v<0?'-':'')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});
function ptEquity(){let u=0,m=0;for(const p of S.pt.pos){const px=ptPx(p.sym)||p.entry;u+=ptNet(p,px);m+=p.margin+p.fee}return{eq:S.pt.bal+m+u,u,m}}
function ptOpen(side,sym,margin,lev,sl,tp,px){
  const P=S.pt,fee=margin*lev*FEE;
  if(!(margin>0)||margin+fee>P.bal+1e-9){toast('الرصيد غير كافٍ');return false}
  const qty=margin*lev/px;P.bal-=margin+fee;
  P.pos.push({id:P.seq++,sym,side,qty,entry:px,margin,lev,sl:sl||0,tp:tp||0,fee,t:Date.now()});ptSave();dirty=true;
  toast((side==='buy'?'شراء ':'بيع ')+sym+' @ '+fm(px,S.sym.dec));return true}
function ptClose(p,px,why){
  const P=S.pt,pnl=ptPnl(p,px),cf=p.qty*px*FEE,net=pnl-cf-p.fee;
  P.bal+=Math.max(0,p.margin+pnl-cf);P.net+=net;
  P.pos=P.pos.filter(x=>x!==p);
  P.hist.unshift({sym:p.sym,side:p.side,entry:p.entry,exit:px,net,why:why||'يدوي',t:Date.now()});if(P.hist.length>60)P.hist.pop();
  ptSave();dirty=true;toast((net>=0?'ربح +':'خسارة ')+fm(net)+'$ — '+(why||'إغلاق'))}
function ptCheck(){
  const P=S.pt;let ch=false;
  for(const p of [...P.pos]){const px=ptPx(p.sym);if(!px)continue;const pnl=ptPnl(p,px);
    if(pnl<=-0.9*p.margin){ptClose(p,px,'تصفية (Liquidation)');ch=true;continue}
    if(p.sl&&(p.side==='buy'?px<=p.sl:px>=p.sl)){ptClose(p,px,'وقف الخسارة');ch=true;continue}
    if(p.tp&&(p.side==='buy'?px>=p.tp:px<=p.tp)){ptClose(p,px,'جني الأرباح');ch=true}}
  for(const o of [...P.ord]){const px=ptPx(o.sym);if(!px)continue;
    if(o.side==='buy'?px<=o.price:px>=o.price){P.ord=P.ord.filter(x=>x!==o);if(!ptOpen(o.side,o.sym,o.margin,o.lev,o.sl,o.tp,o.price))toast('أمر معلّق أُلغي: رصيد غير كافٍ');ch=true}}
  const e=ptEquity();
  if(!P.pos.length&&P.bal<1&&!P.blownShown){P.blownShown=true;toast('تصفّى الحساب — أعد من جديد');setTimeout(sheetAcc,600)}
  if(ch)ptSave();ptUI()}

  sm.innerHTML='<div class="r"><span>الرصيد الكلي (Equity)</span><b>'+fm(e.eq)+'$</b></div><div class="r"><span>المتاح</span><b>'+fm(P.bal)+'$</b></div><div class="r"><span>الربح/الخسارة المفتوحة</span><b class="'+(e.u>=0?'pnl-up':'pnl-dn')+'">'+fm(e.u)+'$</b></div><div class="r"><span>إجمالي الإيداعات</span><b>'+fm(P.dep)+'$</b></div><div class="r"><span>صافي الأرباح المحققة</span><b class="'+(P.net>=0?'pnl-up':'pnl-dn')+'">'+fm(P.net)+'$</b></div><div class="r"><span>النقاط</span><b>'+fm(Math.max(0,P.net),0)+'</b></div><div class="r"><span>مرات إعادة الحساب</span><b>'+P.resets+'</b></div>';
  b.appendChild(sm);
  const dp=document.createElement('div');dp.className='prow';
  dp.innerHTML='<div class="r"><b>إيداع وهمي</b><span class="small">إجمالي الإيداعات: '+fm(P.dep)+'$</span></div><div class="fld" style="margin:0"><input type="number" id="depA" placeholder="المبلغ بالدولار" step="any" style="flex:1;width:auto"><button class="btn on" id="depB" style="padding:12px 18px">إيداع</button></div><div class="seg" style="margin:0">'+[10,50,100,500,1000].map(v=>'<button data-v="'+v+'">+'+v+'</button>').join('')+'</div>';
  const doDep=v=>{if(!(v>0)||v>1e9){toast('أدخل مبلغاً صحيحاً');return}P.bal+=v;P.dep+=v;P.blownShown=false;ptSave();ptUI();toast('تم إيداع '+fm(v)+'$ (وهمي)');sheetAcc()};
  dp.querySelector('#depB').onclick=()=>doDep(+dp.querySelector('#depA').value);
  dp.querySelectorAll('.seg button').forEach(x=>x.onclick=()=>doDep(+x.dataset.v));
  b.appendChild(dp);
  sec(b,'المراكز المفتوحة ('+P.pos.length+')');
  for(const p of P.pos){const px=ptPx(p.sym)||p.entry,u=ptNet(p,px),d=document.createElement('div');d.className='prow';
    d.innerHTML='<div class="r"><b>'+(p.side==='buy'?'🟢 شراء ':'🔴 بيع ')+p.sym+' · '+p.lev+'x</b><b class="'+(u>=0?'pnl-up':'pnl-dn')+'">'+(u>=0?'+':'')+fm(u)+'$</b></div><div class="r"><span>دخول '+fm(p.entry,4)+'</span><span>الآن '+fm(px,4)+'</span></div><div class="r"><span>SL '+(p.sl?fm(p.sl,4):'-')+'</span><span>TP '+(p.tp?fm(p.tp,4):'-')+'</span></div><div class="r"><button class="btn" data-a="sl">SL/TP</button><button class="btn" data-a="c" style="color:#ef5350">إغلاق</button></div>';
    d.querySelector('[data-a=c]').onclick=()=>{ptClose(p,ptPx(p.sym)||p.entry,'إغلاق يدوي');sheetAcc()};
    d.querySelector('[data-a=sl]').onclick=()=>{const a=prompt('وقف الخسارة (0 = بدون)',p.sl||'');if(a===null)return;const t=prompt('جني الأرباح (0 = بدون)',p.tp||'');if(t===null)return;p.sl=+a||0;p.tp=+t||0;ptSave();dirty=true;sheetAcc()};
    b.appendChild(d)}
  if(P.ord.length){sec(b,'أوامر معلّقة');for(const o of P.ord){const d=document.createElement('div');d.className='prow';d.innerHTML='<div class="r"><b>'+(o.side==='buy'?'شراء ':'بيع ')+o.sym+' @ '+fm(o.price,4)+'</b><button class="btn" style="color:#ef5350">إلغاء</button></div>';d.querySelector('button').onclick=()=>{P.ord=P.ord.filter(x=>x!==o);ptSave();dirty=true;sheetAcc()};b.appendChild(d)}}
  sec(b,'آخر الصفقات');
  for(const h of P.hist.slice(0,15)){const d=document.createElement('div');d.className='prow';d.innerHTML='<div class="r"><span>'+(h.side==='buy'?'شراء ':'بيع ')+h.sym+' · '+h.why+'</span><b class="'+(h.net>=0?'pnl-up':'pnl-dn')+'">'+(h.net>=0?'+':'')+fm(h.net)+'$</b></div>';b.appendChild(d)}
  if(!P.hist.length){const d=document.createElement('div');d.className='small';d.style.padding='8px';d.textContent='لا توجد صفقات بعد';b.appendChild(d)}
  const rb=document.createElement('button');rb.className='btn';rb.style.cssText='width:100%;margin-top:14px;padding:14px;color:#ef5350';rb.textContent='إعادة الحساب من جديد بمبلغ تختاره';
  rb.onclick=()=>{const a=prompt('المبلغ الابتدائي للحساب الجديد (دولار):',String(P.dep||1000));if(a===null)return;const v=+a;if(!(v>0)){toast('مبلغ غير صحيح');return}if(confirm('سيتم مسح المراكز والأرباح والبدء بـ '+fm(v)+'$. متأكد؟')){const r=P.resets+1;S.pt=PT0(v);S.pt.resets=r;ptSave();dirty=true;ptUI();sheetAcc()}};
  b.appendChild(rb)})}
$('ptBuy').onclick=()=>openTicket('buy');$('ptSell').onclick=()=>openTicket('sell');$('ptAcc').onclick=sheetAcc;
function ptHit(x,y){
  let best=null,bd=24;
  const chk=(price,p,kind)=>{if(!price||price<yMin||price>yMax)return;const d=Math.abs(yOf(price)-y);if(d<bd){bd=d;best={p,kind}}};
  for(const p of S.pt.pos){if(p.sym!==S.sym.id)continue;chk(p.entry,p,'entry');chk(p.sl,p,'sl');chk(p.tp,p,'tp')}
  for(const o of S.pt.ord){if(o.sym!==S.sym.id)continue;chk(o.price,o,'ord')}
  return best}
function openPosSheet(p,kind){
  const isOrd=S.pt.ord.includes(p);
  if(!isOrd&&!S.pt.pos.includes(p)){closeSheet();return}
  openSheet(isOrd?'أمر معلّق':'إدارة الصفقة',b=>{
    const dec=S.sym.dec,px=ptPx(p.sym)||p.entry;
    if(isOrd){
      b.innerHTML='<div class="small" style="padding:6px 2px">'+(p.side==='buy'?'Limit شراء ':'Limit بيع ')+p.sym+' @ '+fm(p.price,dec)+'</div><button class="btn" id="oc" style="width:100%;padding:14px;color:#ef5350">إلغاء الأمر</button>';
      b.querySelector('#oc').onclick=()=>{S.pt.ord=S.pt.ord.filter(x=>x!==p);ptSave();dirty=true;closeSheet();toast('أُلغي الأمر')};return}
    const u=ptNet(p,px);
    b.innerHTML='<div class="prow"><div class="r"><b>'+(p.side==='buy'?'🟢 شراء ':'🔴 بيع ')+p.sym+' · '+p.lev+'x</b><b class="'+(u>=0?'pnl-up':'pnl-dn')+'">'+(u>=0?'+':'')+fm(u)+'$</b></div><div class="r"><span>دخول '+fm(p.entry,dec)+'</span><span>الآن '+fm(px,dec)+'</span></div></div>'+
     '<div class="fld"><label>وقف الخسارة SL</label><input type="number" id="pSL" step="any" value="'+(p.sl||'')+'"></div><div class="r" style="display:flex;gap:8px;margin:4px 0"><button class="btn" id="pSLc" style="flex:1">تحديد من الشارت</button><button class="btn" id="pSLx" style="flex:1">إزالة</button></div>'+
     '<div class="fld"><label>جني الأرباح TP</label><input type="number" id="pTP" step="any" value="'+(p.tp||'')+'"></div><div class="r" style="display:flex;gap:8px;margin:4px 0"><button class="btn" id="pTPc" style="flex:1">تحديد من الشارت</button><button class="btn" id="pTPx" style="flex:1">إزالة</button></div>'+
     '<button class="btn on" id="pOk" style="width:100%;padding:14px;margin-top:8px">حفظ</button>'+
     '<button class="btn" id="pCl" style="width:100%;padding:14px;margin-top:8px;color:#ef5350">إغلاق الصفقة الآن</button>';
    const g=id=>b.querySelector('#'+id),buy=p.side==='buy';
    const read=()=>{const sl=+g('pSL').value||0,tp=+g('pTP').value||0;
      if(sl&&(buy?sl>=px:sl<=px)){toast('SL في الاتجاه الخاطئ');return null}
      if(tp&&(buy?tp<=px:tp>=px)){toast('TP في الاتجاه الخاطئ');return null}
      return{sl,tp}};
    g('pOk').onclick=()=>{const r=read();if(!r)return;p.sl=r.sl;p.tp=r.tp;ptSave();dirty=true;closeSheet();toast('تم الحفظ')};
    g('pSLx').onclick=()=>{g('pSL').value=''};g('pTPx').onclick=()=>{g('pTP').value=''};
    const arm=k=>{const r=read();if(!r)return;p.sl=r.sl;p.tp=r.tp;ptSave();S.ptSet={p,kind:k};closeSheet();toast('اضغط على الشارت لتحديد '+(k==='sl'?'وقف الخسارة':'جني الأرباح'));dirty=true};
    g('pSLc').onclick=()=>arm('sl');g('pTPc').onclick=()=>arm('tp');
    g('pCl').onclick=()=>{ptClose(p,ptPx(p.sym)||p.entry,'إغلاق يدوي');closeSheet()};
  });
}
function drawPT(){
  const P=S.pt;cx.font='bold 12px sans-serif';cx.textBaseline='middle';
  const line=(p,col,lbl,dash,x0)=>{if(!p||p<yMin||p>yMax)return;const y=Math.round(yOf(p))+.5;cx.strokeStyle=col;cx.lineWidth=1.3;cx.setLineDash(dash?[6,4]:[]);cx.beginPath();cx.moveTo(0,y);cx.lineTo(plotW,y);cx.stroke();cx.setLineDash([]);
    if(lbl){const w=cx.measureText(lbl).width+14;cx.fillStyle=col;cx.fillRect(x0,y-10,w,20);cx.fillStyle='#fff';cx.textAlign='left';cx.fillText(lbl,x0+7,y)}};
  for(const p of P.pos){if(p.sym!==S.sym.id)continue;const px=ptPx(p.sym)||p.entry,u=ptNet(p,px),col=p.side==='buy'?'#26a69a':'#ef5350';
    line(p.entry,col,(p.side==='buy'?'شراء ':'بيع ')+p.lev+'x  '+(u>=0?'+':'')+fm(u)+'$',false,90);
    if(p.sl)line(p.sl,'#ef5350','SL '+fm(ptNet(p,p.sl),2)+'$',true,6);if(p.tp)line(p.tp,'#26a69a','TP +'+fm(ptNet(p,p.tp),2)+'$',true,6)}
  for(const o of P.ord){if(o.sym!==S.sym.id)continue;line(o.price,'#ffb300',(o.side==='buy'?'Limit شراء':'Limit بيع'),true,6)}
}
function loop(){
  const now=performance.now();
  if(dirty){
    if(now-lastRun>250||dirty&&now-lastRun>120){lastRun=now;runInds()}
    draw();dirty=false;
  }
  requestAnimationFrame(loop);
}
let tick=0;setInterval(()=>{dirty=true},500);
init();loop();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){let had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload();had=true});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}
</script>
